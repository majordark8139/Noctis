name: Build Windows 7 SP1 x64

on:
  push:
    branches:
      - feat/win7-lossless-v1.6.7
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-win7:
    name: Windows 7 SP1 x64 Build
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            6.0.x
            8.0.x

      - name: Restore dependencies
        run: dotnet restore src/Noctis/Noctis.csproj -r win-x64

      - name: Publish self-contained Windows 7 x64 package
        run: dotnet publish src/Noctis/Noctis.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false -o ./dist/noctis-win7

      - name: Archive Windows 7 release package
        shell: pwsh
        run: Compress-Archive -Path ./dist/noctis-win7/* -DestinationPath ./Noctis-v1.6.7-Win7-x64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: Noctis-v1.6.7-Win7-x64
          path: ./Noctis-v1.6.7-Win7-x64.zip
          retention-days: 30
